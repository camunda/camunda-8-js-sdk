name: Commitlint
on: [pull_request]

# Checks only: this workflow never pushes. It used to run `prettier --write`
# and push a "style: apply Prettier formatting" commit, which caused problems:
# - `npm install` could rewrite package-lock.json (npm 10 vs the author's npm),
#   and the commit step staged every changed file, lockfile included.
# - The push used GITHUB_TOKEN, so the runs on the new head commit waited for
#   manual approval ("action_required"), stalling the PR.
# - On fork PRs the push cannot work at all.
# Formatting is applied locally by the husky pre-commit hook (lint-staged runs
# prettier on staged src/**/*.ts), so this check normally passes untouched.
permissions:
  contents: read

jobs:
  lint-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Ensures commit history is fetched

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22" # Specify a Node.js version

      # npm ci installs exactly what the lockfile says and never rewrites it.
      # It also fails if package.json and package-lock.json are out of sync.
      - name: Install dependencies
        run: npm ci

      - name: Lint commit messages
        run: npx commitlint --from=${{ github.event.pull_request.base.sha }} --to=${{ github.event.pull_request.head.sha }} --verbose

      - name: Check Prettier formatting
        run: |
          if ! npm run format:check; then
            echo "::error::Some files are not Prettier-formatted (listed above). Run 'npm run format' and commit the result."
            exit 1
          fi

      - name: Run ESLint
        run: npm run lint
