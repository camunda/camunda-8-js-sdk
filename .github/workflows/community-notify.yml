name: Community & Dependabot Notifications

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  notify:
    # The reusable workflow's jobs request these (to record a marker comment
    # for the Slack reaction-on-merge feature). A called workflow cannot exceed
    # the caller's grant, and the top-level `permissions: {}` grants nothing,
    # so without this every run fails at startup.
    permissions:
      issues: write
      pull-requests: write
    uses: camunda/sdk-infra/.github/workflows/sdk-slack-community-notify.yml@v1
    with:
      repo-name: camunda-8-js-sdk
      mention-group: ${{ vars.SLACK_MENTION_GROUP }}
      author-association: ${{ github.event.pull_request.author_association || github.event.issue.author_association }}
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_SDK_ALERTS }}
      vault-addr: ${{ secrets.VAULT_ADDR }}
      vault-role-id: ${{ secrets.VAULT_ROLE_ID }}
      vault-secret-id: ${{ secrets.VAULT_SECRET_ID }}
